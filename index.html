<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김택권 포트폴리오</title>
  <style>
    :root {
      --bg: #eef3f8;
      --ink: #0b1f3d;
      --muted: #526173;
      --blue: #1f64e0;
      --line: rgba(11, 31, 61, 0.14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px;
      background:
        radial-gradient(circle at 15% 18%, rgba(31, 100, 224, 0.16), transparent 30%),
        radial-gradient(circle at 82% 20%, rgba(8, 148, 127, 0.14), transparent 28%),
        linear-gradient(135deg, #f8fafc, #f7efe2);
      color: var(--ink);
      font-family: Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(920px, 100%);
      padding: 44px;
      border: 1px solid rgba(255,255,255,0.74);
      border-radius: 24px;
      background: rgba(255,255,255,0.76);
      box-shadow: 0 24px 80px rgba(11, 31, 61, 0.14);
      backdrop-filter: blur(16px);
    }
    p { color: var(--muted); font-size: 19px; font-weight: 700; line-height: 1.55; }
    h1 { margin: 0 0 12px; font-size: clamp(44px, 7vw, 76px); line-height: 1; letter-spacing: -0.05em; }
    .eyebrow { margin: 0 0 14px; color: var(--blue); font-size: 14px; font-weight: 950; letter-spacing: 0.12em; }
    .links { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 30px; }
    a {
      display: grid;
      gap: 8px;
      min-height: 150px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      color: inherit;
      text-decoration: none;
    }
    a:hover { border-color: var(--blue); transform: translateY(-2px); }
    b { font-size: 24px; }
    span { color: var(--muted); font-size: 15px; font-weight: 780; line-height: 1.45; }
    @media (max-width: 720px) { body { padding: 18px; } main { padding: 26px; } .links { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">KIM TAEK KWON PORTFOLIO</p>
    <h1>김택권 포트폴리오</h1>
    <p>GitHub Pages 배포 루트에서 두 포트폴리오 페이지로 이동할 수 있습니다.</p>
    <div class="links">
      <a href="./web-starter/">
        <b>웹 포트폴리오</b>
        <span>스크롤형 웹페이지 포트폴리오</span>
      </a>
      <a href="./portfolio-ppt/">
        <b>16:9 PPT 포트폴리오</b>
        <span>슬라이드형 포트폴리오 웹페이지 및 PDF 출력본</span>
      </a>
    </div>
  </main>
</body>
</html>
